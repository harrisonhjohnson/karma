[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karma"
version = "0.1.0"
description = "Personal knowledge graph where entries (seeds) have auto-discovered relationships (roots)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=2.7.0",
    "streamlit>=1.32.0",
    "pyvis>=0.3.2",
    "click>=8.1.7",
    "anthropic>=0.21.0",
    "numpy>=1.26.0",
    "networkx>=3.2.0",
    "python-frontmatter>=1.1.0",
    "python-slugify>=8.0.4",
]

[project.scripts]
karma = "karma.cli:cli"
karma-ui = "karma.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["karma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
